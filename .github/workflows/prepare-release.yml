name: Prepare native binding zip

# Builds the 5 prebuilt NAPI binaries on GitHub-hosted runners, stages them
# under packages/binding/npm/*, and uploads a zip for manual npm publish.
# This workflow never publishes to the registry.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PNPM_VERSION: 9.0.0
  NODE_VERSION: 20

jobs:
  build-native:
    name: Native ${{ matrix.settings.platform }}
    runs-on: ${{ matrix.settings.runner }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            runner: macos-latest
          - target: x86_64-apple-darwin
            platform: darwin-x64
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          --filter "@zealakit/css-doctor-binding..." --filter "."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Ensure macOS x64 Rust target
        if: matrix.settings.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: prepare-native-${{ matrix.settings.target }}
          cache-on-failure: true

      - name: Install Zig and cargo-zigbuild for musl
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          pipx install ziglang
          pipx install cargo-zigbuild
          pipx ensurepath
          export PATH="$HOME/.local/bin:$PATH"
          sudo ln -sf "$(which python-zig)" /usr/local/bin/zig
          zig version
          cargo-zigbuild --version

      - name: Expose Node and Rust tools on system PATH
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          for tool in node pnpm cargo rustc rustup; do
            tool_path="$(command -v "$tool" || true)"
            if [ -n "$tool_path" ]; then
              sudo ln -sf "$tool_path" "/usr/local/bin/$tool"
            fi
          done

      - name: Build native binding (musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        shell: bash
        env:
          PATH: /home/runner/.local/bin:/home/runner/.cargo/bin:/home/runner/setup-pnpm/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          zig version
          pnpm --filter @zealakit/css-doctor-binding build \
            --target "${{ matrix.settings.target }}" \
            --zig

      - name: Build native binding (non-musl)
        if: matrix.settings.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @zealakit/css-doctor-binding build \
            --target "${{ matrix.settings.target }}"

      - name: Verify native output
        shell: bash
        run: |
          set -euo pipefail
          ls -la packages/binding/*.node
          test -f "packages/binding/css-doctor-binding.${{ matrix.settings.platform }}.node"

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.settings.platform }}
          path: packages/binding/css-doctor-binding.${{ matrix.settings.platform }}.node
          if-no-files-found: error
          retention-days: 14

  bundle-native-zip:
    name: Bundle native binding zip
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          path: native-binaries
          merge-multiple: true

      - name: Stage platform packages and create zip
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Downloaded binaries"
          find native-binaries -type f -print | sort
          echo "::endgroup::"

          version=$(node -p "require('./packages/binding/package.json').version")
          echo "Using binding version: ${version}"

          platforms=(
            "darwin-arm64"
            "darwin-x64"
            "linux-x64-gnu"
            "linux-x64-musl"
            "win32-x64-msvc"
          )

          staging_root="native-binding-packages"
          rm -rf "${staging_root}"
          mkdir -p "${staging_root}"

          for platform in "${platforms[@]}"; do
            package_name="css-doctor-binding-${platform}"
            source_dir="packages/binding/npm/${package_name}"
            dest_dir="${staging_root}/${package_name}"
            binary_name="css-doctor-binding.${platform}.node"

            if [ ! -d "${source_dir}" ]; then
              echo "::error::Missing checked-in platform package template: ${source_dir}"
              exit 1
            fi

            artifact=$(find native-binaries -type f -name "${binary_name}" -print -quit)
            if [ -z "${artifact}" ]; then
              artifact=$(find native-binaries -type f -name "*${platform}*.node" -print -quit)
            fi
            if [ -z "${artifact}" ]; then
              echo "::error::Missing native binary for ${platform}"
              exit 1
            fi

            mkdir -p "${dest_dir}"
            cp -R "${source_dir}/." "${dest_dir}/"
            cp "${artifact}" "${dest_dir}/${binary_name}"

            node -e "
              const fs = require('node:fs');
              const path = require('node:path');
              const manifestPath = path.join(process.argv[1], 'package.json');
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              manifest.version = process.argv[2];
              manifest.main = process.argv[3];
              manifest.files = [process.argv[3]];
              manifest.publishConfig = manifest.publishConfig ?? {};
              manifest.publishConfig.access = 'public';
              delete manifest.private;
              fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            " "${dest_dir}" "${version}" "${binary_name}"

            echo "Staged ${package_name}@${version} <- ${artifact}"
          done

          staged_count=$(find "${staging_root}" -type f -name '*.node' | wc -l | tr -d ' ')
          echo "Staged .node count: ${staged_count} (expected 5)"
          if [ "${staged_count}" -ne 5 ]; then
            echo "::error::Expected 5 staged native binaries, found ${staged_count}"
            exit 1
          fi

          zip_name="css-doctor-native-bindings-v${version}.zip"
          rm -f "${zip_name}"
          (
            cd "${staging_root}"
            zip -rq "../${zip_name}" .
          )

          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"
          echo "BINDING_VERSION=${version}" >> "$GITHUB_ENV"

          echo "::group::Zip contents"
          unzip -l "${zip_name}"
          ls -lh "${zip_name}"
          echo "::endgroup::"

      - name: Upload native binding zip
        uses: actions/upload-artifact@v4
        with:
          name: css-doctor-native-bindings
          path: css-doctor-native-bindings-v${{ env.BINDING_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Maintainer instructions
        run: |
          {
            echo "## Native binding zip ready"
            echo ""
            echo "Version: \`${BINDING_VERSION}\`"
            echo "Artifact: \`css-doctor-native-bindings\`"
            echo ""
            echo "This workflow **does not** publish to npm."
            echo ""
            echo "### Manual publish steps"
            echo ""
            echo "1. Download the \`css-doctor-native-bindings\` artifact from this run."
            echo "2. Unzip it (you will get five folders: \`css-doctor-binding-<platform>\`)."
            echo "3. From each folder, publish the platform package:"
            echo ""
            echo '```bash'
            echo "npm login"
            echo "for d in css-doctor-binding-darwin-arm64 css-doctor-binding-darwin-x64 \\"
            echo "         css-doctor-binding-linux-x64-gnu css-doctor-binding-linux-x64-musl \\"
            echo "         css-doctor-binding-win32-x64-msvc; do"
            echo "  (cd \"\$d\" && npm publish --access public)"
            echo "done"
            echo '```'
            echo ""
            echo "4. Locally (darwin-arm64 is enough), rebuild the main loader if needed:"
            echo ""
            echo '```bash'
            echo "pnpm --filter @zealakit/css-doctor-binding build"
            echo "pnpm --filter @zealakit/css-doctor-binding publish --access public --no-git-checks"
            echo '```'
            echo ""
            echo "Or copy the five folders into \`packages/binding/npm/\` and use \`pnpm publish:npm:binding\`."
          } >> "$GITHUB_STEP_SUMMARY"
